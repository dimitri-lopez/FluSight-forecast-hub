methods: "An extended SLIR compartmental model defined as a branching process model with sequentially calibrated state estimation."
data_inputs: "Weekly confirmed influenza hospital admissions and the number of hospitals reporting in each jurisdiction."
methods_long: "EMBERS is a mechanistic and statistically interpretable effective reproduction number inference engine built for operational forecasting. The epidemic is modelled as a branching process formulation of an extended SLIR compartmental model, calibrated with a marginal particle filter. A forecast is decomposed into two tasks: recovering the latent state of the epidemic, and propagating it forward under the dynamics. The forecast prior on future transmission is fitted on past seasons. Jurisdictions, including the US, are fitted independently, with no spatial correlation. \"Ensemble\" refers to the ensemble of particles, each carrying the moments of the epidemic state, not to a combination of separate models."
backfill_adjustment: "A reporting model fitted leave-one-season-out on past NHSN releases. Each recent week's published count is either already final or still to be revised, mostly upward, with jurisdiction-specific completeness shrunk toward the national pattern. When a jurisdiction's release is behind, it tends to be behind for all its recent weeks at once, so their revisions are modelled jointly. The newest week is also adjusted for the number of hospitals reporting relative to the jurisdiction's season median. The model gives a likelihood over each recent week's eventual count, which the filter assimilates in place of the raw preliminary count."
